[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climatepass-processing"
version = "0.1.0"
description = "ClimatePass AI EO ingestion, spatial processing and scoring (layer 1 of 3)"
requires-python = ">=3.11"
dependencies = [
    "climatepass-core",
    # Vector
    "geopandas>=0.14",
    "shapely>=2.0",
    "osmnx>=1.9",
    "networkx>=3.3",
    # Raster
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "rasterstats>=0.19",
    # EO catalogue access
    "odc-stac>=0.3.9",
    "pystac-client>=0.8",
    "boto3>=1.34",
    # Hydrology (HAND) and modelling
    "pysheds>=0.4",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["processing"]
