[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climatepass-core"
version = "0.1.0"
description = "Shared config, SQLAlchemy models and DB session for ClimatePass AI"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["core"]

[tool.setuptools.package-data]
core = ["*.yaml"]
