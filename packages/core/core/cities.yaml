# ClimatePass AI — area of interest definitions.
#
# bbox is [min_lon, min_lat, max_lon, max_lat] in EPSG:4326.
# utm_epsg is the projected CRS used for ALL metric math (lengths, buffers,
# zonal stats). Geometry is always STORED as EPSG:4326.
#
# aoi_variants exists because P2 has a scope guard: if the full FCT bbox
# yields >80k road segments we tighten to `municipal` rather than blow the
# schedule. Switching is a config change, not a code change.

cities:
  abuja:
    name: Abuja Federal Capital Territory
    country: Nigeria
    # Full FCT: ~lat 8°24'N–9°21'N, lon 6°45'E–7°39'E
    bbox: [6.75, 8.40, 7.65, 9.35]
    # Map default centre — Central Area / Three Arms Zone.
    centroid: [7.4913, 9.0579]
    utm_epsg: 32632  # WGS 84 / UTM zone 32N
    timezone: Africa/Lagos

    aoi_variants:
      full:
        bbox: [6.75, 8.40, 7.65, 9.35]
        note: Entire Federal Capital Territory.
      municipal:
        # AMAC + the built-up corridor. Contains the demo route
        # (Central Area -> Lugbe), Kubwa, Gwarinpa, Asokoro, the airport road.
        bbox: [7.25, 8.90, 7.62, 9.22]
        note: Fallback AOI if the full FCT exceeds the P2 segment budget.

    # Bundled gazetteer: powers offline geocoding AND the map's place labels.
    # Positions are approximate district/landmark centroids, good to a few
    # hundred metres — adequate for a label and for seeding a route, not a
    # survey reference. All lie inside the municipal AOI.
    landmarks:
      # --- core city ---
      - { name: "Central Area", lat: 9.0579, lon: 7.4913, kind: district }
      - { name: "Central Business District", lat: 9.0450, lon: 7.4850, kind: district }
      - { name: "Garki", lat: 9.0333, lon: 7.4833, kind: district }
      - { name: "Garki II", lat: 9.0290, lon: 7.4900, kind: district }
      - { name: "Area 1", lat: 9.0230, lon: 7.4900, kind: district }
      - { name: "Area 11", lat: 9.0350, lon: 7.5000, kind: district }
      - { name: "Wuse 2", lat: 9.0765, lon: 7.4626, kind: district }
      - { name: "Wuse Zone 1", lat: 9.0648, lon: 7.4735, kind: district }
      - { name: "Maitama", lat: 9.0870, lon: 7.4951, kind: district }
      - { name: "Asokoro", lat: 9.0392, lon: 7.5261, kind: district }
      - { name: "Guzape", lat: 9.0450, lon: 7.5300, kind: district }
      # --- north west corridor ---
      - { name: "Jabi", lat: 9.0693, lon: 7.4258, kind: district }
      - { name: "Jabi Lake", lat: 9.0700, lon: 7.4200, kind: water }
      - { name: "Utako", lat: 9.0716, lon: 7.4400, kind: district }
      - { name: "Wuye", lat: 9.0533, lon: 7.4400, kind: district }
      - { name: "Kado", lat: 9.0900, lon: 7.4300, kind: district }
      - { name: "Katampe", lat: 9.0900, lon: 7.4600, kind: district }
      - { name: "Mpape", lat: 9.1200, lon: 7.4800, kind: district }
      - { name: "Life Camp", lat: 9.1000, lon: 7.4200, kind: district }
      - { name: "Gwarinpa", lat: 9.1088, lon: 7.4066, kind: district }
      - { name: "Dawaki", lat: 9.1300, lon: 7.3900, kind: district }
      - { name: "Dutse", lat: 9.1400, lon: 7.3700, kind: district }
      - { name: "Kubwa", lat: 9.1518, lon: 7.3269, kind: district }
      - { name: "Idu", lat: 9.0900, lon: 7.3600, kind: district }
      # --- south ---
      - { name: "Durumi", lat: 9.0180, lon: 7.4700, kind: district }
