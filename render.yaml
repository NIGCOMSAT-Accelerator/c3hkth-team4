# Render Blueprint — https://render.com/docs/blueprint-spec
#
#   Render dashboard -> New -> Blueprint -> point at this repo
#
# Three services and a database. No persistent disk anywhere: the API carries
# its routing graph inside the image and reads everything else from Postgres.
#
# Read DEPLOY.md before running this. Two steps cannot be automated here —
# seeding the database, and pasting each service's URL into the other's env.

databases:
  - name: climatepass-db
    databaseName: climatepass
    user: climatepass
    # `free` is fine for the hackathon but Render DELETES free databases after
    # 30 days. Move to `basic-256mb` if this needs to outlive the event.
    plan: free
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: climatepass-api
    runtime: docker
    # `starter` on purpose. On `free`, Render spins the service down after 15
    # minutes idle and the next request pays a ~50 s cold start — which is
    # exactly what a judge clicking your link at 9pm would hit.
    plan: starter
    region: frankfurt # closest Render region to Nigeria
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    # ONE worker, deliberately. The routing graph is held in process memory and
    # is NOT shared between workers — each one loads its own copy. Measured at
    # ~180 MB per worker after pruning, so two workers exceed Starter's 512 MB
    # and the deploy is killed with "Ran out of memory". Scale by adding
    # instances, not workers, until the graph moves to a shared service.
    dockerCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: false # deploy deliberately, not on every push during a sprint
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: climatepass-db
          property: connectionString
      # DELIBERATELY UNSET so the deployment is live: the API serves the most
      # recent scored day, and climatepass-daily below advances that every
      # morning. Set it to a date (e.g. 2026-08-02) only to freeze the view
      # for a recording — the seeded day is a wet one, whereas a live dry day
      # legitimately shows no High-risk roads at all.
      - key: DEMO_DATE
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      # Set to the static site's URL after its first deploy. Leaving it "*"
      # works, but a public API that accepts any origin is a habit worth not
      # forming.
      - key: API_CORS_ORIGINS
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: WEBHOOK_HMAC_SECRET
        generateValue: true

  # ---------------------------------------------------------------- Web
  - type: web
    name: climatepass-web
    runtime: static
    # rootDir makes apps/web the service root, so the build runs there and the
    # publish path is resolved from there too. The previous form —
    # `cd apps/web && ...` with staticPublishPath: apps/web/dist — built
    # correctly but Render served 404 because it looked for index.html
    # somewhere other than where the build put it. This is the documented
    # monorepo pattern and removes the ambiguity.
    rootDir: apps/web
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    envVars:
      # Baked in at BUILD time by Vite, so changing it requires a rebuild, not
      # just a restart. Set it to the API's URL before the first build.
      - key: VITE_API_BASE
        sync: false
    routes:
      # Single-page app: unknown paths must serve index.html, or a refresh on
      # /results returns 404 and the user loses their analysis.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Hashed asset filenames are immutable, so they can be cached hard.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # ------------------------------------------------------- Daily scoring
  # This is what makes the deployment live rather than a snapshot. It re-scores
  # all 42,914 segments against the current day's rainfall and writes a new
  # segment_risk row set; the API picks it up because it serves the most recent
  # scored date.
  #
  # Cheap: susceptibility is already in the database and does NOT need
  # recomputing, so this touches no rasters and no DEM. It fetches rainfall and
  # runs one SQL statement — about 10 seconds.
  - type: cron
    name: climatepass-daily
    runtime: docker
    # 03:30 UTC = 04:30 Africa/Lagos, ahead of the morning commute.
    schedule: "30 3 * * *"
    region: frankfurt
    dockerfilePath: ./services/processing/Dockerfile
    dockerContext: .
    dockerCommand: python -m processing.scoring.daily --city abuja
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: climatepass-db
          property: connectionString
      # Must be false: this job exists to reach the rainfall APIs.
      - key: DEMO_MODE
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"

  # ------------------------------------------------- Alerts (optional)
  # Only needed if you want alerts firing on the deployment. The demo can show
  # them locally instead — see DEPLOY.md. Render cron jobs are billed per run.
  #
  # NOTE: with SMTP unset this writes .eml files to an EPHEMERAL disk, so they
  # vanish. Configure SMTP_HOST here, or keep the alerts demo local where the
  # outbox persists.
  - type: cron
    name: climatepass-alerts
    runtime: docker
    schedule: "*/30 * * * *"
    region: frankfurt
    dockerfilePath: ./services/alerts/Dockerfile
    dockerContext: .
    dockerCommand: python -m alerts.evaluate --now
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: climatepass-db
          property: connectionString
      - key: DEMO_DATE
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: WEBHOOK_HMAC_SECRET
        sync: false
